name: LinuxCloudWatchAgent
description: Installs and configures Amazon CloudWatch Agent on RHEL
schemaVersion: 1.0
phases:
  - name: build
    steps:
      - name: InstallCloudWatchAgent
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              TOKEN=$(curl -fsS -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 300')
              REGION=$(curl -fsS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/region)
              dnf install -y "https://s3.${REGION}.amazonaws.com/amazoncloudwatch-agent-${REGION}/amazon_linux/amd64/latest/amazon-cloudwatch-agent.rpm"
      - name: ConfigureCloudWatchAgent
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json <<'CONF'
              {
                "agent": {
                  "metrics_collection_interval": 60,
                  "run_as_user": "root"
                },
                "logs": {
                  "logs_collected": {
                    "files": {
                      "collect_list": [
                        {
                          "file_path": "/var/log/messages",
                          "log_group_name": "/aws/ec2/golden-ami",
                          "log_stream_name": "{instance_id}/messages",
                          "timestamp_format": "%b %d %H:%M:%S"
                        },
                        {
                          "file_path": "/var/log/secure",
                          "log_group_name": "/aws/ec2/golden-ami",
                          "log_stream_name": "{instance_id}/secure",
                          "timestamp_format": "%b %d %H:%M:%S"
                        },
                        {
                          "file_path": "/var/log/dnf.log",
                          "log_group_name": "/aws/ec2/golden-ami",
                          "log_stream_name": "{instance_id}/dnf",
                          "timestamp_format": "%Y-%m-%d %H:%M:%S"
                        }
                      ]
                    }
                  }
                },
                "metrics": {
                  "namespace": "CWAgent",
                  "metrics_collected": {
                    "cpu": {
                      "measurement": [
                        "cpu_usage_idle",
                        "cpu_usage_iowait",
                        "cpu_usage_user",
                        "cpu_usage_system"
                      ],
                      "metrics_collection_interval": 60,
                      "resources": ["*"]
                    },
                    "disk": {
                      "measurement": [
                        "disk_used_percent",
                        "disk_inodes_free"
                      ],
                      "metrics_collection_interval": 60,
                      "resources": ["*"]
                    },
                    "diskio": {
                      "measurement": [
                        "diskio_io_time",
                        "diskio_read_bytes",
                        "diskio_write_bytes"
                      ],
                      "metrics_collection_interval": 60,
                      "resources": ["*"]
                    },
                    "mem": {
                      "measurement": [
                        "mem_used_percent",
                        "mem_available",
                        "mem_total"
                      ],
                      "metrics_collection_interval": 60
                    },
                    "netstat": {
                      "measurement": [
                        "tcp_established",
                        "tcp_time_wait"
                      ],
                      "metrics_collection_interval": 60
                    },
                    "swap": {
                      "measurement": [
                        "swap_used_percent"
                      ],
                      "metrics_collection_interval": 60
                    }
                  }
                }
              }
              CONF
      - name: StartCloudWatchAgent
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
              systemctl enable amazon-cloudwatch-agent
              systemctl start amazon-cloudwatch-agent
  - name: validate
    steps:
      - name: VerifyCloudWatchAgent
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              systemctl is-enabled amazon-cloudwatch-agent
              systemctl is-active amazon-cloudwatch-agent
              rpm -q amazon-cloudwatch-agent